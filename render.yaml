services:
  - type: web
    name: culture-index-hr-tool
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker only: the survey list, status queue and change tracker live in process memory.
    startCommand: gunicorn app_dash_simple:server --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --access-logfile /dev/null --log-level warning
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: REDIS_URL
        sync: false
