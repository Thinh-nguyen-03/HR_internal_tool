services:
  - type: web
    name: culture-index-hr-tool
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app_dash_simple:server --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile /dev/null --log-level warning
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BACKGROUND_JOB_SECRET
        generateValue: true
      - key: CACHE_BACKEND
        value: redis

  - type: cron
    name: survey-sync-hourly
    runtime: image
    plan: starter
    image:
      url: docker.io/curlimages/curl:latest
    schedule: "0 * * * *"
    dockerCommand: "sh -c 'curl -X POST -H \"Authorization: Bearer $BACKGROUND_JOB_SECRET\" -H \"Content-Type: application/json\" --max-time 120 --retry 3 --retry-delay 10 \"$APP_URL/api/background-refresh\"'"
    envVars:
      - key: APP_URL
        sync: false
      - key: BACKGROUND_JOB_SECRET
        fromService:
          name: culture-index-hr-tool
          type: web
          envVarKey: BACKGROUND_JOB_SECRET

